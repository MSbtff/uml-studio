[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["tests/.runtime"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/e2e/support/run_test_server.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
