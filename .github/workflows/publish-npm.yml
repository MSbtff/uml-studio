name: Stage npm release

on:
  workflow_dispatch:
    inputs:
      stage:
        description: Upload the tested tarball to npm for approval
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    name: Pack and test the npm package
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      artifact-id: ${{ steps.tarball.outputs.artifact-id }}
    steps:
      - name: Check out the release commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install development dependencies
        run: npm ci
      - name: Pack and test in a standalone consumer project
        env:
          DDL_PACKAGE_OUTPUT_DIR: ${{ runner.temp }}/npm-release
        run: |
          mkdir -p "$DDL_PACKAGE_OUTPUT_DIR"
          node --test tests/ddl-to-mermaid.test.js
      - name: Save the tested tarball
        id: tarball
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ddl-to-mermaid-tarball
          path: ${{ runner.temp }}/npm-release/uml-studio-ddl-to-mermaid-*.tgz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  stage:
    name: Stage the npm package for approval
    needs: verify
    if: github.ref == 'refs/heads/main' && inputs.stage
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      id-token: write
    concurrency:
      group: npm-stage-ddl-to-mermaid
      cancel-in-progress: false
    steps:
      - name: Set up Node.js and the npm registry
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Download the tested tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact-id }}
          path: ${{ runner.temp }}/npm-release
      - name: Stage the tested tarball
        shell: bash
        run: |
          shopt -s nullglob
          tarballs=("$RUNNER_TEMP"/npm-release/uml-studio-ddl-to-mermaid-*.tgz)
          if (( ${#tarballs[@]} != 1 )); then
            echo "Expected exactly one tested DDL-to-Mermaid tarball." >&2
            exit 1
          fi
          npm stage publish "${tarballs[0]}" --access public
